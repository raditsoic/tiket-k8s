# The only knobs for this lab. Deploy = bump image.tag — CI commits that on
# every main build (see vagrant-lab k8s README, CI/CD). Registry prefix:
# change 10.0.2.2:5000 here if the lab switches to the tunnel-mode registry
# hostname.
image:
  registry: 10.0.2.2:5000
  repository: tiket-app
  tag: "main-11"

# Two workers, one pod each. The topologySpreadConstraints in the template
# enforce the one-pod-per-node demo — keep this <= worker count or pods stall.
replicas: 2

service:
  # HAProxy on cp load-balances the workers' kube-proxy NodePort listeners.
  nodePort: 30080
