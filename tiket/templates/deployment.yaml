# The old Ansible template, now a Helm chart template — this repo is the
# source of truth, deployed by ArgoCD (Application "tiket-app", auto-sync,
# rendered with ArgoCD's bundled Helm). Deploy = bump image.tag in
# values.yaml (CI commits it); rollback = git revert. The DB Secret is NOT
# in this repo: Ansible applies it from the vault (see vagrant-lab/k8s
# README). The registry prefix lives in values.yaml (image.registry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiket-app
  labels:
    app: tiket-app
spec:
  replicas: {{ .Values.replicas }}
  # Rollouts must kill before they schedule: with the hard one-pod-per-node
  # spread below, a RollingUpdate surge pod (default maxSurge 25% -> 1 on two
  # replicas) can never be placed on a 2-worker cluster and stalls forever.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tiket-app
  template:
    metadata:
      labels:
        app: tiket-app
    spec:
      # One pod per worker node — preserves the old "one container per web VM"
      # load-balancing demo (greeting alternates web1/web2).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tiket-app
      containers:
        - name: tiket-app
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          # `latest` is a moving tag CI re-pushes; containerd must re-pull.
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: tiket-app-env
          env:
            # Downward API: NODE_NAME carries the node name (web1/web2) for
            # per-node identification; the greeting itself comes from the
            # pod hostname and stays pod-scoped.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
