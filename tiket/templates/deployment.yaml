# The old Ansible template, now a Helm chart template — this repo is the
# source of truth, deployed by ArgoCD (Application "tiket-app", auto-sync,
# rendered with ArgoCD's bundled Helm). Deploy = bump image.tag in
# values.yaml (CI commits it); rollback = git revert. The DB Secret is NOT
# in this repo: Ansible applies it from the vault (see vagrant-lab/k8s
# README). The registry prefix lives in values.yaml (image.registry).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiket-app
  labels:
    app: tiket-app
spec:
  replicas: {{ .Values.replicas }}
  # Zero-downtime: surge the new pod before killing an old one
  # (maxUnavailable 0). This only schedules because the nodeAffinity in
  # the pod spec below keeps cp out of the topology-spread domains —
  # without it every surge pod is skew-2 against cp's zero-pod domain
  # and stays Pending forever.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tiket-app
  template:
    metadata:
      labels:
        app: tiket-app
    spec:
      # Keep pods on the workers only. Two effects: cp (the tainted
      # control plane) is never a scheduling target, and — because
      # nodeAffinityPolicy defaults to Honor — cp is excluded from the
      # spread domains below, so a surge pod may transiently double up
      # on one worker during rollouts.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: {{ .Values.workers | toJson }}
      # One pod per worker node — preserves the old "one container per web VM"
      # load-balancing demo (greeting alternates web1/web2).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: tiket-app
      containers:
        - name: tiket-app
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}
          # `latest` is a moving tag CI re-pushes; containerd must re-pull.
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: tiket-app-env
          env:
            # Downward API: NODE_NAME carries the node name (web1/web2) for
            # per-node identification; the greeting itself comes from the
            # pod hostname and stays pod-scoped.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
